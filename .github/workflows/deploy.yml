name: Deploy to Azure

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2

            - uses: azure/login@v2
              with:
                creds: ${{ secrets.AZURE_CREDENTIALS }}
            
            - run: az group list --output table

